#
# My - Sandboxie configuration file
#
# Fresh default configuration: a single sandbox (DefaultBox) and nothing else.
# Everything not listed here falls back to the driver's built-in defaults, so
# upgrading is a matter of replacing the binaries - this file stays untouched.
#
# The sandbox storage lives inside the installation directory:
#   %SbieHome%\Sandbox\<box name>
#

[GlobalSettings]
EditAdminOnly=n
FileRootPath=%SbieHome%\Sandbox\%SANDBOX%
DefaultBox=DefaultBox

[DefaultBox]
Enabled=y
